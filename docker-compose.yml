services:
  auto-attendance:
    image: ghcr.io/ayasy-el/auto-attendance:latest
    # Alternatively, build locally from source instead of pulling the prebuilt image:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: auto-attendance
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      FORCE_COLOR: "1"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - data:/app/data
    init: true

volumes:
  data:
